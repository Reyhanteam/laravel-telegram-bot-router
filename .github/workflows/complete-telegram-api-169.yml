name: Complete Telegram API 169

on:
  push:
    branches:
      - feature/telegram-api-169

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add remaining 69 Telegram API methods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          methods = [
              ('getUpdates', 'public static function getUpdates(?int $offset = null, ?int $limit = null, ?int $timeout = null, ?array $allowedUpdates = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setWebhook', 'public static function setWebhook(string $url, mixed $certificate = null, ?string $ipAddress = null, ?int $maxConnections = null, ?array $allowedUpdates = null, ?bool $dropPendingUpdates = null, ?string $secretToken = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteWebhook', 'public static function deleteWebhook(?bool $dropPendingUpdates = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getWebhookInfo', 'public static function getWebhookInfo(): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('forwardMessage', 'public static function forwardMessage(int|string $chatId, int|string $fromChatId, int $messageId, ?int $messageThreadId = null, ?int $directMessagesTopicId = null, ?int $videoStartTimestamp = null, ?bool $disableNotification = null, ?bool $protectContent = null, ?string $messageEffectId = null, ?array $suggestedPostParameters = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('forwardMessages', 'public static function forwardMessages(int|string $chatId, int|string $fromChatId, array $messageIds, ?int $messageThreadId = null, ?int $directMessagesTopicId = null, ?bool $disableNotification = null, ?bool $protectContent = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('copyMessage', 'public static function copyMessage(int|string $chatId, int|string $fromChatId, int $messageId, ?int $messageThreadId = null, ?int $directMessagesTopicId = null, ?int $videoStartTimestamp = null, ?string $caption = null, ?string $parseMode = null, ?array $captionEntities = null, ?bool $showCaptionAboveMedia = null, ?bool $disableNotification = null, ?bool $protectContent = null, ?bool $allowPaidBroadcast = null, ?string $messageEffectId = null, ?array $suggestedPostParameters = null, ?array $replyParameters = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('copyMessages', 'public static function copyMessages(int|string $chatId, int|string $fromChatId, array $messageIds, ?int $messageThreadId = null, ?int $directMessagesTopicId = null, ?bool $disableNotification = null, ?bool $protectContent = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('sendSticker', 'public static function sendSticker(?string $businessConnectionId, int|string $chatId, mixed $sticker, ?int $messageThreadId = null, ?int $directMessagesTopicId = null, ?int $receiverUserId = null, ?string $callbackQueryId = null, ?string $emoji = null, ?bool $disableNotification = null, ?bool $protectContent = null, ?bool $allowPaidBroadcast = null, ?string $messageEffectId = null, ?array $suggestedPostParameters = null, ?array $replyParameters = null, ?array $replyMarkup = null, ?array $ephemeralMessageParameters = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('sendChecklist', 'public static function sendChecklist(string $businessConnectionId, int|string $chatId, array $checklist, ?bool $disableNotification = null, ?bool $protectContent = null, ?string $messageEffectId = null, ?array $replyParameters = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setMessageReaction', 'public static function setMessageReaction(int|string $chatId, int $messageId, ?array $reaction = null, ?bool $isBig = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setChatMemberTag', 'public static function setChatMemberTag(int|string $chatId, int $userId, ?string $tag = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageText', 'public static function editMessageText(?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?string $text = null, ?string $parseMode = null, ?array $entities = null, ?array $linkPreviewOptions = null, ?array $richMessage = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageCaption', 'public static function editMessageCaption(?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?string $caption = null, ?string $parseMode = null, ?array $captionEntities = null, ?bool $showCaptionAboveMedia = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageMedia', 'public static function editMessageMedia(array $media, ?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageLivePhoto', 'public static function editMessageLivePhoto(array $media, ?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageLiveLocation', 'public static function editMessageLiveLocation(float $latitude, float $longitude, ?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?int $livePeriod = null, ?float $horizontalAccuracy = null, ?int $heading = null, ?int $proximityAlertRadius = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('stopMessageLiveLocation', 'public static function stopMessageLiveLocation(?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageReplyMarkup', 'public static function editMessageReplyMarkup(?string $businessConnectionId = null, int|string|null $chatId = null, ?int $messageId = null, ?string $inlineMessageId = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editMessageChecklist', 'public static function editMessageChecklist(string $businessConnectionId, int|string $chatId, int $messageId, array $checklist, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('stopPoll', 'public static function stopPoll(int|string $chatId, int $messageId, ?string $businessConnectionId = null, ?array $replyMarkup = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteMessage', 'public static function deleteMessage(int|string $chatId, int $messageId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteMessages', 'public static function deleteMessages(int|string $chatId, array $messageIds): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteEphemeralMessage', 'public static function deleteEphemeralMessage(int|string $chatId, int $receiverUserId, int $ephemeralMessageId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteMessageReaction', 'public static function deleteMessageReaction(int|string $chatId, int $messageId, ?int $userId = null, ?int $actorChatId = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteAllMessageReactions', 'public static function deleteAllMessageReactions(int|string $chatId, ?int $userId = null, ?int $actorChatId = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getStickerSet', 'public static function getStickerSet(string $name): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getCustomEmojiStickers', 'public static function getCustomEmojiStickers(array $customEmojiIds): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('uploadStickerFile', 'public static function uploadStickerFile(int $userId, mixed $sticker, string $stickerFormat): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('createNewStickerSet', 'public static function createNewStickerSet(int $userId, string $name, string $title, array $stickers, ?string $stickerType = null, ?bool $needsRepainting = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('addStickerToSet', 'public static function addStickerToSet(int $userId, string $name, array $sticker): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerPositionInSet', 'public static function setStickerPositionInSet(string $sticker, int $position): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteStickerFromSet', 'public static function deleteStickerFromSet(string $sticker): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('replaceStickerInSet', 'public static function replaceStickerInSet(int $userId, string $name, string $oldSticker, array $sticker): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerEmojiList', 'public static function setStickerEmojiList(string $sticker, array $emojiList): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerKeywords', 'public static function setStickerKeywords(string $sticker, ?array $keywords = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerMaskPosition', 'public static function setStickerMaskPosition(string $sticker, ?array $maskPosition = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerSetTitle', 'public static function setStickerSetTitle(string $name, string $title): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setStickerSetThumbnail', 'public static function setStickerSetThumbnail(string $name, int $userId, string $format, mixed $thumbnail = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setCustomEmojiStickerSetThumbnail', 'public static function setCustomEmojiStickerSetThumbnail(string $name, ?string $customEmojiId = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteStickerSet', 'public static function deleteStickerSet(string $name): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('answerInlineQuery', 'public static function answerInlineQuery(string $inlineQueryId, array $results, ?int $cacheTime = null, ?bool $isPersonal = null, ?string $nextOffset = null, ?array $button = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('answerWebAppQuery', 'public static function answerWebAppQuery(string $webAppQueryId, array $result): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('savePreparedInlineMessage', 'public static function savePreparedInlineMessage(int $userId, array $result, ?bool $allowUserChats = null, ?bool $allowBotChats = null, ?bool $allowGroupChats = null, ?bool $allowChannelChats = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('savePreparedKeyboardButton', 'public static function savePreparedKeyboardButton(int $userId, array $button): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('postStory', 'public static function postStory(string $businessConnectionId, array $content, int $activePeriod, ?string $caption = null, ?string $parseMode = null, ?array $captionEntities = null, ?array $areas = null, ?bool $postToChatPage = null, ?bool $protectContent = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('repostStory', 'public static function repostStory(string $businessConnectionId, int $fromChatId, int $fromStoryId, int $activePeriod, ?bool $postToChatPage = null, ?bool $protectContent = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editStory', 'public static function editStory(string $businessConnectionId, int $storyId, array $content, ?string $caption = null, ?string $parseMode = null, ?array $captionEntities = null, ?array $areas = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteStory', 'public static function deleteStory(string $businessConnectionId, int $storyId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getChatGifts', 'public static function getChatGifts(int|string $chatId, ?bool $excludeUnsaved = null, ?bool $excludeSaved = null, ?bool $excludeUnlimited = null, ?bool $excludeLimitedUpgradable = null, ?bool $excludeLimitedNonUpgradable = null, ?bool $excludeFromBlockchain = null, ?bool $excludeUnique = null, ?bool $sortByPrice = null, ?string $offset = null, ?int $limit = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getBusinessAccountStarBalance', 'public static function getBusinessAccountStarBalance(string $businessConnectionId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('transferBusinessAccountStars', 'public static function transferBusinessAccountStars(string $businessConnectionId, int $starCount): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getBusinessAccountGifts', 'public static function getBusinessAccountGifts(string $businessConnectionId, ?bool $excludeUnsaved = null, ?bool $excludeSaved = null, ?bool $excludeUnlimited = null, ?bool $excludeLimitedUpgradable = null, ?bool $excludeLimitedNonUpgradable = null, ?bool $excludeUnique = null, ?bool $excludeFromBlockchain = null, ?bool $sortByPrice = null, ?string $offset = null, ?int $limit = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setBusinessAccountName', 'public static function setBusinessAccountName(string $businessConnectionId, string $firstName, ?string $lastName = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setBusinessAccountUsername', 'public static function setBusinessAccountUsername(string $businessConnectionId, ?string $username = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setBusinessAccountBio', 'public static function setBusinessAccountBio(string $businessConnectionId, ?string $bio = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setBusinessAccountProfilePhoto', 'public static function setBusinessAccountProfilePhoto(string $businessConnectionId, array $photo, ?bool $isPublic = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('removeBusinessAccountProfilePhoto', 'public static function removeBusinessAccountProfilePhoto(string $businessConnectionId, ?bool $isPublic = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('setBusinessAccountGiftSettings', 'public static function setBusinessAccountGiftSettings(string $businessConnectionId, bool $showGiftButton, array $acceptedGiftTypes): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('readBusinessMessage', 'public static function readBusinessMessage(string $businessConnectionId, int $chatId, int $messageId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('deleteBusinessMessages', 'public static function deleteBusinessMessages(string $businessConnectionId, array $messageIds): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getMyStarBalance', 'public static function getMyStarBalance(): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getStarTransactions', 'public static function getStarTransactions(?int $offset = null, ?int $limit = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('refundStarPayment', 'public static function refundStarPayment(int $userId, string $telegramPaymentChargeId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('editUserStarSubscription', 'public static function editUserStarSubscription(int $userId, string $telegramPaymentChargeId, bool $isCanceled): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('getUserGifts', 'public static function getUserGifts(int $userId, ?bool $excludeUnlimited = null, ?bool $excludeLimitedUpgradable = null, ?bool $excludeLimitedNonUpgradable = null, ?bool $excludeFromBlockchain = null, ?bool $excludeUnique = null, ?bool $sortByPrice = null, ?string $offset = null, ?int $limit = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('transferGift', 'public static function transferGift(string $businessConnectionId, string $ownedGiftId, int $newOwnerChatId, ?int $starCount = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('convertGiftToStars', 'public static function convertGiftToStars(string $businessConnectionId, string $ownedGiftId): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
              ('upgradeGift', 'public static function upgradeGift(string $businessConnectionId, string $ownedGiftId, ?bool $keepOriginalDetails = null, ?int $starCount = null): mixed { return static::dispatch(__FUNCTION__, func_get_args()); }'),
          ]

          # Create trait containing all new real static methods.
          trait = Path('src/Facades/TelegramApiAdditionalMethods.php')
          trait.parent.mkdir(parents=True, exist_ok=True)
          trait.write_text(
              '<?php\n\ndeclare(strict_types=1);\n\nnamespace ReyhanTeam\\TelegramBotRouter\\Facades;\n\n/**\n * The remaining Telegram Bot API methods exposed as real static facade methods.\n *\n * @see https://core.telegram.org/bots/api\n */\ntrait TelegramApiAdditionalMethods\n{\n' + ''.join(f'    {signature}\n' for _, signature in methods) + '}\n',
              encoding='utf-8'
          )

          # Import/use the trait inside BOT. Existing 100 methods remain untouched.
          bot_path = Path('src/Facades/BOT.php')
          bot = bot_path.read_text(encoding='utf-8')
          if 'use TelegramApiAdditionalMethods;' not in bot:
              bot = bot.replace('final class BOT extends Facade\n{', 'final class BOT extends Facade\n{\n    use TelegramApiAdditionalMethods;')
              bot_path.write_text(bot, encoding='utf-8')

          # Extend the registry without rewriting its existing 100 definitions.
          registry_path = Path('src/Core/TelegramApiMethodRegistry.php')
          registry = registry_path.read_text(encoding='utf-8')

          names = [name for name, _ in methods]
          marker = "        'verifyUser',\n    ];"
          additions = ''.join(f"        '{name}',\n" for name in names)
          if names[0] not in registry:
              if marker not in registry:
                  raise SystemExit('METHODS insertion marker not found')
              registry = registry.replace(marker, additions + marker, 1)

          definitions = {
              'getUpdates': ([], ['offset','limit','timeout','allowed_updates']),
              'setWebhook': (['url'], ['certificate','ip_address','max_connections','allowed_updates','drop_pending_updates','secret_token']),
              'deleteWebhook': ([], ['drop_pending_updates']),
              'getWebhookInfo': ([], []),
              'forwardMessage': (['chat_id','from_chat_id','message_id'], ['message_thread_id','direct_messages_topic_id','video_start_timestamp','disable_notification','protect_content','message_effect_id','suggested_post_parameters']),
              'forwardMessages': (['chat_id','from_chat_id','message_ids'], ['message_thread_id','direct_messages_topic_id','disable_notification','protect_content']),
              'copyMessage': (['chat_id','from_chat_id','message_id'], ['message_thread_id','direct_messages_topic_id','video_start_timestamp','caption','parse_mode','caption_entities','show_caption_above_media','disable_notification','protect_content','allow_paid_broadcast','message_effect_id','suggested_post_parameters','reply_parameters','reply_markup']),
              'copyMessages': (['chat_id','from_chat_id','message_ids'], ['message_thread_id','direct_messages_topic_id','disable_notification','protect_content']),
              'sendSticker': (['chat_id','sticker'], ['business_connection_id','message_thread_id','direct_messages_topic_id','receiver_user_id','callback_query_id','emoji','disable_notification','protect_content','allow_paid_broadcast','message_effect_id','suggested_post_parameters','reply_parameters','reply_markup','ephemeral_message_parameters']),
              'sendChecklist': (['business_connection_id','chat_id','checklist'], ['disable_notification','protect_content','message_effect_id','reply_parameters','reply_markup']),
              'setMessageReaction': (['chat_id','message_id'], ['reaction','is_big']),
              'setChatMemberTag': (['chat_id','user_id'], ['tag']),
              'editMessageText': ([], ['business_connection_id','chat_id','message_id','inline_message_id','text','parse_mode','entities','link_preview_options','rich_message','reply_markup']),
              'editMessageCaption': ([], ['business_connection_id','chat_id','message_id','inline_message_id','caption','parse_mode','caption_entities','show_caption_above_media','reply_markup']),
              'editMessageMedia': (['media'], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
              'editMessageLivePhoto': (['media'], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
              'editMessageLiveLocation': (['latitude','longitude'], ['business_connection_id','chat_id','message_id','inline_message_id','live_period','horizontal_accuracy','heading','proximity_alert_radius','reply_markup']),
              'stopMessageLiveLocation': ([], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
              'editMessageReplyMarkup': ([], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
              'editMessageChecklist': (['business_connection_id','chat_id','message_id','checklist'], ['reply_markup']),
              'stopPoll': (['chat_id','message_id'], ['business_connection_id','reply_markup']),
              'deleteMessage': (['chat_id','message_id'], []),
              'deleteMessages': (['chat_id','message_ids'], []),
              'deleteEphemeralMessage': (['chat_id','receiver_user_id','ephemeral_message_id'], []),
              'deleteMessageReaction': (['chat_id','message_id'], ['user_id','actor_chat_id']),
              'deleteAllMessageReactions': (['chat_id'], ['user_id','actor_chat_id']),
              'getStickerSet': (['name'], []),
              'getCustomEmojiStickers': (['custom_emoji_ids'], []),
              'uploadStickerFile': (['user_id','sticker','sticker_format'], []),
              'createNewStickerSet': (['user_id','name','title','stickers'], ['sticker_type','needs_repainting']),
              'addStickerToSet': (['user_id','name','sticker'], []),
              'setStickerPositionInSet': (['sticker','position'], []),
              'deleteStickerFromSet': (['sticker'], []),
              'replaceStickerInSet': (['user_id','name','old_sticker','sticker'], []),
              'setStickerEmojiList': (['sticker','emoji_list'], []),
              'setStickerKeywords': (['sticker'], ['keywords']),
              'setStickerMaskPosition': (['sticker'], ['mask_position']),
              'setStickerSetTitle': (['name','title'], []),
              'setStickerSetThumbnail': (['name','user_id','format'], ['thumbnail']),
              'setCustomEmojiStickerSetThumbnail': (['name'], ['custom_emoji_id']),
              'deleteStickerSet': (['name'], []),
              'answerInlineQuery': (['inline_query_id','results'], ['cache_time','is_personal','next_offset','button']),
              'answerWebAppQuery': (['web_app_query_id','result'], []),
              'savePreparedInlineMessage': (['user_id','result'], ['allow_user_chats','allow_bot_chats','allow_group_chats','allow_channel_chats']),
              'savePreparedKeyboardButton': (['user_id','button'], []),
              'postStory': (['business_connection_id','content','active_period'], ['caption','parse_mode','caption_entities','areas','post_to_chat_page','protect_content']),
              'repostStory': (['business_connection_id','from_chat_id','from_story_id','active_period'], ['post_to_chat_page','protect_content']),
              'editStory': (['business_connection_id','story_id','content'], ['caption','parse_mode','caption_entities','areas']),
              'deleteStory': (['business_connection_id','story_id'], []),
              'getChatGifts': (['chat_id'], ['exclude_unsaved','exclude_saved','exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_from_blockchain','exclude_unique','sort_by_price','offset','limit']),
              'getBusinessAccountStarBalance': (['business_connection_id'], []),
              'transferBusinessAccountStars': (['business_connection_id','star_count'], []),
              'getBusinessAccountGifts': (['business_connection_id'], ['exclude_unsaved','exclude_saved','exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_unique','exclude_from_blockchain','sort_by_price','offset','limit']),
              'setBusinessAccountName': (['business_connection_id','first_name'], ['last_name']),
              'setBusinessAccountUsername': (['business_connection_id'], ['username']),
              'setBusinessAccountBio': (['business_connection_id'], ['bio']),
              'setBusinessAccountProfilePhoto': (['business_connection_id','photo'], ['is_public']),
              'removeBusinessAccountProfilePhoto': (['business_connection_id'], ['is_public']),
              'setBusinessAccountGiftSettings': (['business_connection_id','show_gift_button','accepted_gift_types'], []),
              'readBusinessMessage': (['business_connection_id','chat_id','message_id'], []),
              'deleteBusinessMessages': (['business_connection_id','message_ids'], []),
              'getMyStarBalance': ([], []),
              'getStarTransactions': ([], ['offset','limit']),
              'refundStarPayment': (['user_id','telegram_payment_charge_id'], []),
              'editUserStarSubscription': (['user_id','telegram_payment_charge_id','is_canceled'], []),
              'getUserGifts': (['user_id'], ['exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_from_blockchain','exclude_unique','sort_by_price','offset','limit']),
              'transferGift': (['business_connection_id','owned_gift_id','new_owner_chat_id'], ['star_count']),
              'convertGiftToStars': (['business_connection_id','owned_gift_id'], []),
              'upgradeGift': (['business_connection_id','owned_gift_id'], ['keep_original_details','star_count']),
          }

          definition_marker = "        'verifyUser' => ['required' => ['user_id'], 'optional' => ['custom_description']],\n    ];"
          definition_additions = ''.join(
              f"        '{name}' => ['required' => {required!r}, 'optional' => {optional!r}],\n"
              .replace('"', "'")
              for name, (required, optional) in definitions.items()
          )
          if "'getUpdates' =>" not in registry:
              if definition_marker not in registry:
                  raise SystemExit('DEFINITIONS insertion marker not found')
              registry = registry.replace(definition_marker, definition_additions + definition_marker, 1)

          registry_path.write_text(registry, encoding='utf-8')

          # Sanity-check counts before committing.
          bot_text = bot_path.read_text(encoding='utf-8')
          trait_text = trait.read_text(encoding='utf-8')
          count = len(re.findall(r'public static function\\s+([A-Za-z0-9_]+)\\s*\\(', bot_text)) + len(re.findall(r'public static function\\s+([A-Za-z0-9_]+)\\s*\\(', trait_text))
          if count != 169:
              raise SystemExit(f'Expected 169 public static API methods, found {count}')
          if len(definitions) != 69:
              raise SystemExit(f'Expected 69 registry definitions, found {len(definitions)}')
          PY

      - name: Validate PHP syntax and method count

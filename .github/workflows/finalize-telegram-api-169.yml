name: Finalize Telegram API 169

on:
  push:
    branches:
      - feature/telegram-api-169

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate trait and registry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          names = [
            'getUpdates','setWebhook','deleteWebhook','getWebhookInfo','forwardMessage','forwardMessages','copyMessage','copyMessages','sendSticker','sendChecklist','setMessageReaction','setChatMemberTag','editMessageText','editMessageCaption','editMessageMedia','editMessageLivePhoto','editMessageLiveLocation','stopMessageLiveLocation','editMessageReplyMarkup','editMessageChecklist','stopPoll','deleteMessage','deleteMessages','deleteEphemeralMessage','deleteMessageReaction','deleteAllMessageReactions','getStickerSet','getCustomEmojiStickers','uploadStickerFile','createNewStickerSet','addStickerToSet','setStickerPositionInSet','deleteStickerFromSet','replaceStickerInSet','setStickerEmojiList','setStickerKeywords','setStickerMaskPosition','setStickerSetTitle','setStickerSetThumbnail','setCustomEmojiStickerSetThumbnail','deleteStickerSet','answerInlineQuery','answerWebAppQuery','savePreparedInlineMessage','savePreparedKeyboardButton','postStory','repostStory','editStory','deleteStory','getChatGifts','getBusinessAccountStarBalance','transferBusinessAccountStars','getBusinessAccountGifts','setBusinessAccountName','setBusinessAccountUsername','setBusinessAccountBio','setBusinessAccountProfilePhoto','removeBusinessAccountProfilePhoto','setBusinessAccountGiftSettings','readBusinessMessage','deleteBusinessMessages','getMyStarBalance','getStarTransactions','refundStarPayment','editUserStarSubscription','getUserGifts','transferGift','convertGiftToStars','upgradeGift'
          ]

          definitions = {
            'getUpdates': ([], ['offset','limit','timeout','allowed_updates']),
            'setWebhook': (['url'], ['certificate','ip_address','max_connections','allowed_updates','drop_pending_updates','secret_token']),
            'deleteWebhook': ([], ['drop_pending_updates']),
            'getWebhookInfo': ([], []),
            'forwardMessage': (['chat_id','from_chat_id','message_id'], ['message_thread_id','direct_messages_topic_id','video_start_timestamp','disable_notification','protect_content','message_effect_id','suggested_post_parameters']),
            'forwardMessages': (['chat_id','from_chat_id','message_ids'], ['message_thread_id','direct_messages_topic_id','disable_notification','protect_content']),
            'copyMessage': (['chat_id','from_chat_id','message_id'], ['message_thread_id','direct_messages_topic_id','video_start_timestamp','caption','parse_mode','caption_entities','show_caption_above_media','disable_notification','protect_content','allow_paid_broadcast','message_effect_id','suggested_post_parameters','reply_parameters','reply_markup']),
            'copyMessages': (['chat_id','from_chat_id','message_ids'], ['message_thread_id','direct_messages_topic_id','disable_notification','protect_content']),
            'sendSticker': (['chat_id','sticker'], ['business_connection_id','message_thread_id','direct_messages_topic_id','receiver_user_id','callback_query_id','emoji','disable_notification','protect_content','allow_paid_broadcast','message_effect_id','suggested_post_parameters','reply_parameters','reply_markup','ephemeral_message_parameters']),
            'sendChecklist': (['business_connection_id','chat_id','checklist'], ['disable_notification','protect_content','message_effect_id','reply_parameters','reply_markup']),
            'setMessageReaction': (['chat_id','message_id'], ['reaction','is_big']),
            'setChatMemberTag': (['chat_id','user_id'], ['tag']),
            'editMessageText': ([], ['business_connection_id','chat_id','message_id','inline_message_id','text','parse_mode','entities','link_preview_options','rich_message','reply_markup']),
            'editMessageCaption': ([], ['business_connection_id','chat_id','message_id','inline_message_id','caption','parse_mode','caption_entities','show_caption_above_media','reply_markup']),
            'editMessageMedia': (['media'], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
            'editMessageLivePhoto': (['media'], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
            'editMessageLiveLocation': (['latitude','longitude'], ['business_connection_id','chat_id','message_id','inline_message_id','live_period','horizontal_accuracy','heading','proximity_alert_radius','reply_markup']),
            'stopMessageLiveLocation': ([], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
            'editMessageReplyMarkup': ([], ['business_connection_id','chat_id','message_id','inline_message_id','reply_markup']),
            'editMessageChecklist': (['business_connection_id','chat_id','message_id','checklist'], ['reply_markup']),
            'stopPoll': (['chat_id','message_id'], ['business_connection_id','reply_markup']),
            'deleteMessage': (['chat_id','message_id'], []),
            'deleteMessages': (['chat_id','message_ids'], []),
            'deleteEphemeralMessage': (['chat_id','receiver_user_id','ephemeral_message_id'], []),
            'deleteMessageReaction': (['chat_id','message_id'], ['user_id','actor_chat_id']),
            'deleteAllMessageReactions': (['chat_id'], ['user_id','actor_chat_id']),
            'getStickerSet': (['name'], []),
            'getCustomEmojiStickers': (['custom_emoji_ids'], []),
            'uploadStickerFile': (['user_id','sticker','sticker_format'], []),
            'createNewStickerSet': (['user_id','name','title','stickers'], ['sticker_type','needs_repainting']),
            'addStickerToSet': (['user_id','name','sticker'], []),
            'setStickerPositionInSet': (['sticker','position'], []),
            'deleteStickerFromSet': (['sticker'], []),
            'replaceStickerInSet': (['user_id','name','old_sticker','sticker'], []),
            'setStickerEmojiList': (['sticker','emoji_list'], []),
            'setStickerKeywords': (['sticker'], ['keywords']),
            'setStickerMaskPosition': (['sticker'], ['mask_position']),
            'setStickerSetTitle': (['name','title'], []),
            'setStickerSetThumbnail': (['name','user_id','format'], ['thumbnail']),
            'setCustomEmojiStickerSetThumbnail': (['name'], ['custom_emoji_id']),
            'deleteStickerSet': (['name'], []),
            'answerInlineQuery': (['inline_query_id','results'], ['cache_time','is_personal','next_offset','button']),
            'answerWebAppQuery': (['web_app_query_id','result'], []),
            'savePreparedInlineMessage': (['user_id','result'], ['allow_user_chats','allow_bot_chats','allow_group_chats','allow_channel_chats']),
            'savePreparedKeyboardButton': (['user_id','button'], []),
            'postStory': (['business_connection_id','content','active_period'], ['caption','parse_mode','caption_entities','areas','post_to_chat_page','protect_content']),
            'repostStory': (['business_connection_id','from_chat_id','from_story_id','active_period'], ['post_to_chat_page','protect_content']),
            'editStory': (['business_connection_id','story_id','content'], ['caption','parse_mode','caption_entities','areas']),
            'deleteStory': (['business_connection_id','story_id'], []),
            'getChatGifts': (['chat_id'], ['exclude_unsaved','exclude_saved','exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_from_blockchain','exclude_unique','sort_by_price','offset','limit']),
            'getBusinessAccountStarBalance': (['business_connection_id'], []),
            'transferBusinessAccountStars': (['business_connection_id','star_count'], []),
            'getBusinessAccountGifts': (['business_connection_id'], ['exclude_unsaved','exclude_saved','exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_unique','exclude_from_blockchain','sort_by_price','offset','limit']),
            'setBusinessAccountName': (['business_connection_id','first_name'], ['last_name']),
            'setBusinessAccountUsername': (['business_connection_id'], ['username']),
            'setBusinessAccountBio': (['business_connection_id'], ['bio']),
            'setBusinessAccountProfilePhoto': (['business_connection_id','photo'], ['is_public']),
            'removeBusinessAccountProfilePhoto': (['business_connection_id'], ['is_public']),
            'setBusinessAccountGiftSettings': (['business_connection_id','show_gift_button','accepted_gift_types'], []),
            'readBusinessMessage': (['business_connection_id','chat_id','message_id'], []),
            'deleteBusinessMessages': (['business_connection_id','message_ids'], []),
            'getMyStarBalance': ([], []),
            'getStarTransactions': ([], ['offset','limit']),
            'refundStarPayment': (['user_id','telegram_payment_charge_id'], []),
            'editUserStarSubscription': (['user_id','telegram_payment_charge_id','is_canceled'], []),
            'getUserGifts': (['user_id'], ['exclude_unlimited','exclude_limited_upgradable','exclude_limited_non_upgradable','exclude_from_blockchain','exclude_unique','sort_by_price','offset','limit']),
            'transferGift': (['business_connection_id','owned_gift_id','new_owner_chat_id'], ['star_count']),
            'convertGiftToStars': (['business_connection_id','owned_gift_id'], []),
            'upgradeGift': (['business_connection_id','owned_gift_id'], ['keep_original_details','star_count']),
          }

          bot = Path('src/Facades/BOT.php')
          text = bot.read_text()
          if 'use TelegramApiAdditionalMethods;' not in text:
              text = text.replace('final class BOT extends Facade\n{', 'final class BOT extends Facade\n{\n    use TelegramApiAdditionalMethods;')
              bot.write_text(text)

          registry = Path('src/Core/TelegramApiMethodRegistry.php')
          text = registry.read_text()
          if "'getUpdates'," not in text:
              lines = text.splitlines(True)
              for i, line in enumerate(lines):
                  if "'verifyUser'," in line:
                      additions = ''.join(f"        '{name}',\n" for name in names)
                      lines[i:i] = [additions]
                      break
              else:
                  raise SystemExit('verifyUser method marker not found')
              text = ''.join(lines)

          if "'getUpdates' =>" not in text:
              lines = text.splitlines(True)
              additions = ''.join(f"        '{name}' => ['required' => {required!r}, 'optional' => {optional!r}],\n" for name, (required, optional) in definitions.items())
              for i, line in enumerate(lines):
                  if "'verifyUser' =>" in line:
                      lines[i:i] = [additions]
                      break
              else:
                  raise SystemExit('verifyUser definition marker not found')
              text = ''.join(lines)

          registry.write_text(text)
          print('integrated', len(names), 'methods')
          PY
          php -l src/Facades/BOT.php
          php -l src/Facades/TelegramApiAdditionalMethods.php
          php -l src/Core/TelegramApiMethodRegistry.php
          php -r '$r=new ReflectionClass("ReyhanTeam\\TelegramBotRouter\\Facades\\BOT"); $m=array_filter($r->getMethods(ReflectionMethod::IS_PUBLIC), fn($x)=>$x->isStatic()); echo "BOT static methods: ".count($m).PHP_EOL; if(count($m)!==169) exit(1);'
          python3 - <<'PY'
          from pathlib import Path
          text=Path('src/Core/TelegramApiMethodRegistry.php').read_text()
          names=['getUpdates','setWebhook','deleteWebhook','getWebhookInfo','forwardMessage','forwardMessages','copyMessage','copyMessages','sendSticker','sendChecklist','setMessageReaction','setChatMemberTag','editMessageText','editMessageCaption','editMessageMedia','editMessageLivePhoto','editMessageLiveLocation','stopMessageLiveLocation','editMessageReplyMarkup','editMessageChecklist','stopPoll','deleteMessage','deleteMessages','deleteEphemeralMessage','deleteMessageReaction','deleteAllMessageReactions','getStickerSet','getCustomEmojiStickers','uploadStickerFile','createNewStickerSet','addStickerToSet','setStickerPositionInSet','deleteStickerFromSet','replaceStickerInSet','setStickerEmojiList','setStickerKeywords','setStickerMaskPosition','setStickerSetTitle','setStickerSetThumbnail','setCustomEmojiStickerSetThumbnail','deleteStickerSet','answerInlineQuery','answerWebAppQuery','savePreparedInlineMessage','savePreparedKeyboardButton','postStory','repostStory','editStory','deleteStory','getChatGifts','getBusinessAccountStarBalance','transferBusinessAccountStars','getBusinessAccountGifts','setBusinessAccountName','setBusinessAccountUsername','setBusinessAccountBio','setBusinessAccountProfilePhoto','removeBusinessAccountProfilePhoto','setBusinessAccountGiftSettings','readBusinessMessage','deleteBusinessMessages','getMyStarBalance','getStarTransactions','refundStarPayment','editUserStarSubscription','getUserGifts','transferGift','convertGiftToStars','upgradeGift']
          missing=[n for n in names if f"'{n}'" not in text]
          if missing: raise SystemExit('missing registry methods: '+','.join(missing))
          PY
      - name: Commit and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Facades/BOT.php src/Facades/TelegramApiAdditionalMethods.php src/Core/TelegramApiMethodRegistry.php
          git rm .github/workflows/complete-telegram-api-169.yml .github/workflows/finalize-telegram-api-169.yml
          git commit -m "feat: expose remaining 69 Telegram Bot API methods"
          git push
